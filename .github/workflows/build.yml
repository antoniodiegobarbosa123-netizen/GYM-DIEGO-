name: Gerar APK Android

on:
  push:
    branches: [ main, master, principal ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Descompactar projeto
        run: unzip "ARQUIVO ZIP-.zip"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install

      - name: Exportar para Web
        run: npx expo export:web || npx expo export --platform web

      - name: Empacotar APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-aplicativo-apk
          path: web-build/
          
